<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 340" width="920" height="340" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif">
  <defs>
    <marker id="m1" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#7209b7"/></marker>
    <marker id="m2" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#1a1a2e"/></marker>
    <linearGradient id="bg3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fafbff"/><stop offset="100%" stop-color="#f5f5fa"/>
    </linearGradient>
  </defs>
  <rect width="920" height="340" rx="12" fill="url(#bg3)" stroke="#e0e0e8" stroke-width="1"/>
  <text x="460" y="28" font-size="15" fill="#1a1a2e" text-anchor="middle" font-weight="700">Fig 3. Multi-Scope Memory — 5-Signal Hybrid Retrieval</text>

  <!-- Memory Types -->
  <text x="40" y="56" font-size="12" fill="#7209b7" font-weight="600">7 Memory Types (MemorySchema)</text>
  <rect x="40" y="66" width="95" height="30" rx="5" fill="#7209b7"/><text x="87" y="85" font-size="10" fill="#fff" text-anchor="middle">fact</text>
  <rect x="145" y="66" width="95" height="30" rx="5" fill="#7209b7"/><text x="192" y="85" font-size="10" fill="#fff" text-anchor="middle">preference</text>
  <rect x="250" y="66" width="95" height="30" rx="5" fill="#7209b7"/><text x="297" y="85" font-size="10" fill="#fff" text-anchor="middle">weakness</text>
  <rect x="355" y="66" width="95" height="30" rx="5" fill="#7209b7"/><text x="402" y="85" font-size="10" fill="#fff" text-anchor="middle">milestone</text>
  <rect x="460" y="66" width="115" height="30" rx="5" fill="#7209b7"/><text x="517" y="85" font-size="10" fill="#fff" text-anchor="middle">misconception</text>
  <rect x="585" y="66" width="95" height="30" rx="5" fill="#7209b7"/><text x="632" y="85" font-size="10" fill="#fff" text-anchor="middle">resource</text>
  <rect x="690" y="66" width="140" height="30" rx="5" fill="#7209b7"/><text x="760" y="85" font-size="10" fill="#fff" text-anchor="middle">session_summary</text>

  <!-- Arrow -->
  <line x1="420" y1="96" x2="420" y2="120" stroke="#7209b7" stroke-width="1.5" marker-end="url(#m1)"/>

  <!-- MemoryStore -->
  <rect x="250" y="120" width="340" height="52" rx="8" fill="#1a1a2e"/>
  <text x="420" y="142" font-size="12" fill="#fff" text-anchor="middle" font-weight="600">MemoryStore (Append-only JSONL)</text>
  <text x="420" y="160" font-size="9.5" fill="#aaa" text-anchor="middle">全量 records.jsonl + 按领域分片 by_domain/&lt;domain&gt;.jsonl</text>

  <!-- Arrow -->
  <line x1="420" y1="172" x2="420" y2="198" stroke="#1a1a2e" stroke-width="1.5" marker-end="url(#m2)"/>

  <!-- MemoryRetriever -->
  <rect x="80" y="198" width="760" height="120" rx="10" fill="#fff7ed" stroke="#fb8500" stroke-width="1.5"/>
  <text x="100" y="222" font-size="12" fill="#fb8500" font-weight="600">MemoryRetriever — 5-Signal Weighted Scoring</text>

  <!-- 5 signals -->
  <rect x="100" y="234" width="130" height="44" rx="5" fill="#4361ee"/>
  <text x="165" y="253" font-size="10" fill="#fff" text-anchor="middle" font-weight="600">Semantic</text>
  <text x="165" y="268" font-size="10" fill="#b8c9ff" text-anchor="middle">w = 0.40</text>
  <rect x="240" y="234" width="130" height="44" rx="5" fill="#f72585"/>
  <text x="305" y="253" font-size="10" fill="#fff" text-anchor="middle" font-weight="600">Keyword</text>
  <text x="305" y="268" font-size="10" fill="#ffc2dd" text-anchor="middle">w = 0.25</text>
  <rect x="380" y="234" width="130" height="44" rx="5" fill="#06d6a0"/>
  <text x="445" y="253" font-size="10" fill="#fff" text-anchor="middle" font-weight="600">Entity</text>
  <text x="445" y="268" font-size="10" fill="#d0f5e7" text-anchor="middle">w = 0.20</text>
  <rect x="520" y="234" width="130" height="44" rx="5" fill="#fb8500"/>
  <text x="585" y="253" font-size="10" fill="#fff" text-anchor="middle" font-weight="600">Importance</text>
  <text x="585" y="268" font-size="10" fill="#ffe0b2" text-anchor="middle">w = 0.10</text>
  <rect x="660" y="234" width="130" height="44" rx="5" fill="#7209b7"/>
  <text x="725" y="253" font-size="10" fill="#fff" text-anchor="middle" font-weight="600">Recency</text>
  <text x="725" y="268" font-size="10" fill="#e0cfef" text-anchor="middle">w = 0.05</text>

  <!-- Formula -->
  <rect x="100" y="286" width="720" height="24" rx="4" fill="#f0f1f5"/>
  <text x="460" y="303" font-size="11" text-anchor="middle" font-family="Consolas, JetBrains Mono, monospace" fill="#333">
    score = 0.40·semantic + 0.25·keyword + 0.20·entity + 0.10·importance + 0.05·recency
  </text>
</svg>
