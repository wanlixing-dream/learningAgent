<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 320" width="920" height="320" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif">
  <defs>
    <marker id="a1" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#4361ee"/></marker>
    <marker id="a2" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#7209b7"/></marker>
    <marker id="a3" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#f72585"/></marker>
    <marker id="a4" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#fb8500"/></marker>
    <marker id="a5" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#06d6a0"/></marker>
    <linearGradient id="bg2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fafbff"/><stop offset="100%" stop-color="#f5f5fa"/>
    </linearGradient>
  </defs>
  <rect width="920" height="320" rx="12" fill="url(#bg2)" stroke="#e0e0e8" stroke-width="1"/>
  <text x="460" y="28" font-size="15" fill="#1a1a2e" text-anchor="middle" font-weight="700">Fig 2. RAG Pipeline — Hybrid Retrieval-Augmented Generation</text>

  <!-- Ingestion path -->
  <text x="40" y="58" font-size="12" fill="#4361ee" font-weight="600">Ingestion Path</text>
  <rect x="40" y="68" width="120" height="42" rx="6" fill="#4361ee"/>
  <text x="100" y="86" font-size="11" fill="#fff" text-anchor="middle" font-weight="500">Raw Content</text>
  <text x="100" y="100" font-size="9" fill="#b8c9ff" text-anchor="middle">MD / Text / URL</text>
  <line x1="160" y1="89" x2="200" y2="89" stroke="#4361ee" stroke-width="1.5" marker-end="url(#a1)"/>
  <rect x="200" y="68" width="110" height="42" rx="6" fill="#4361ee"/>
  <text x="255" y="86" font-size="11" fill="#fff" text-anchor="middle" font-weight="500">Chunker</text>
  <text x="255" y="100" font-size="9" fill="#b8c9ff" text-anchor="middle">MD-aware 递归</text>
  <line x1="310" y1="89" x2="350" y2="89" stroke="#4361ee" stroke-width="1.5" marker-end="url(#a1)"/>
  <rect x="350" y="68" width="130" height="42" rx="6" fill="#4361ee"/>
  <text x="415" y="86" font-size="11" fill="#fff" text-anchor="middle" font-weight="500">Embedder</text>
  <text x="415" y="100" font-size="9" fill="#b8c9ff" text-anchor="middle">BAAI/bge-m3</text>
  <line x1="480" y1="89" x2="530" y2="89" stroke="#4361ee" stroke-width="1.5" marker-end="url(#a1)"/>
  <rect x="530" y="68" width="130" height="42" rx="6" fill="#7209b7"/>
  <text x="595" y="86" font-size="11" fill="#fff" text-anchor="middle" font-weight="500">VectorStore</text>
  <text x="595" y="100" font-size="9" fill="#e0cfef" text-anchor="middle">ChromaDB 持久化</text>
  <line x1="660" y1="89" x2="700" y2="89" stroke="#7209b7" stroke-width="1.5" marker-end="url(#a2)"/>
  <rect x="700" y="68" width="150" height="42" rx="6" fill="#7209b7"/>
  <text x="775" y="86" font-size="11" fill="#fff" text-anchor="middle" font-weight="500">BM25 Index</text>
  <text x="775" y="100" font-size="9" fill="#e0cfef" text-anchor="middle">rank_bm25 稀疏索引</text>

  <!-- Query path -->
  <text x="40" y="152" font-size="12" fill="#f72585" font-weight="600">Query Path — HybridRetriever</text>
  <rect x="40" y="165" width="120" height="42" rx="6" fill="#f72585"/>
  <text x="100" y="183" font-size="11" fill="#fff" text-anchor="middle" font-weight="500">User Query</text>
  <text x="100" y="197" font-size="9" fill="#ffc2dd" text-anchor="middle">自然语言问题</text>
  <line x1="160" y1="186" x2="210" y2="186" stroke="#f72585" stroke-width="1.5" marker-end="url(#a3)"/>
  <!-- Fork -->
  <rect x="210" y="165" width="40" height="42" rx="20" fill="#f72585"/>
  <text x="230" y="191" font-size="16" fill="#fff" text-anchor="middle" font-weight="700">⑂</text>
  <!-- Vector branch -->
  <line x1="250" y1="174" x2="310" y2="160" stroke="#7209b7" stroke-width="1.2" marker-end="url(#a2)"/>
  <rect x="310" y="142" width="160" height="36" rx="6" fill="#7209b7"/>
  <text x="390" y="164" font-size="10.5" fill="#fff" text-anchor="middle">Vector Cosine Search</text>
  <!-- BM25 branch -->
  <line x1="250" y1="198" x2="310" y2="215" stroke="#fb8500" stroke-width="1.2" marker-end="url(#a4)"/>
  <rect x="310" y="197" width="160" height="36" rx="6" fill="#fb8500"/>
  <text x="390" y="219" font-size="10.5" fill="#fff" text-anchor="middle">BM25 Sparse Search</text>
  <!-- Merge -->
  <line x1="470" y1="160" x2="530" y2="182" stroke="#7209b7" stroke-width="1.2"/>
  <line x1="470" y1="215" x2="530" y2="192" stroke="#fb8500" stroke-width="1.2"/>
  <rect x="530" y="167" width="170" height="42" rx="6" fill="#06d6a0"/>
  <text x="615" y="185" font-size="10.5" fill="#fff" text-anchor="middle" font-weight="600">Score Fusion</text>
  <text x="615" y="200" font-size="9" fill="#d0f5e7" text-anchor="middle">α·BM25 + (1-α)·Vector</text>
  <line x1="700" y1="188" x2="740" y2="188" stroke="#06d6a0" stroke-width="1.5" marker-end="url(#a5)"/>
  <rect x="740" y="167" width="130" height="42" rx="6" fill="#1a1a2e"/>
  <text x="805" y="185" font-size="10.5" fill="#fff" text-anchor="middle" font-weight="600">LLM Context</text>
  <text x="805" y="200" font-size="9" fill="#aaa" text-anchor="middle">注入 top-k 参考</text>

  <!-- Formula -->
  <rect x="40" y="260" width="840" height="40" rx="8" fill="#f0f1f5" stroke="#ddd"/>
  <text x="460" y="285" font-size="13" text-anchor="middle" font-family="Consolas, JetBrains Mono, monospace" fill="#333">
    final_score = α × BM25_normalized + (1 − α) × vector_cosine_similarity,  α = 0.3
  </text>
</svg>
