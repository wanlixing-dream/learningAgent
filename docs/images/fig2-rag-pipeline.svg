<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 310" width="920" height="310" font-family="Helvetica Neue, Arial, PingFang SC, Microsoft YaHei, sans-serif">
  <defs>
    <marker id="a1" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto"><path d="M0,0 L7,2.5 L0,5" fill="#5b7ea1"/></marker>
    <marker id="a2" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto"><path d="M0,0 L7,2.5 L0,5" fill="#6b5b7b"/></marker>
    <marker id="a3" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto"><path d="M0,0 L7,2.5 L0,5" fill="#a15b6b"/></marker>
    <marker id="a4" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto"><path d="M0,0 L7,2.5 L0,5" fill="#8c7a6b"/></marker>
    <marker id="a5" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto"><path d="M0,0 L7,2.5 L0,5" fill="#4a7c6f"/></marker>
  </defs>
  <rect width="920" height="310" fill="#ffffff"/>
  <text x="460" y="26" font-size="14" fill="#2c3e50" text-anchor="middle" font-weight="700" letter-spacing="0.5">Fig 2.  RAG Pipeline — Hybrid Retrieval-Augmented Generation</text>
  <line x1="120" y1="34" x2="800" y2="34" stroke="#bdc3c7" stroke-width="0.5"/>

  <!-- Ingestion -->
  <text x="40" y="58" font-size="10" fill="#5b7ea1" font-weight="600" letter-spacing="0.5">INGESTION PATH</text>
  <rect x="40" y="66" width="115" height="40" rx="4" fill="#5b7ea1"/><text x="97" y="83" font-size="10" fill="#fff" text-anchor="middle" font-weight="500">Raw Content</text><text x="97" y="97" font-size="8" fill="#c5d5e4" text-anchor="middle">MD / Text / URL</text>
  <line x1="155" y1="86" x2="190" y2="86" stroke="#5b7ea1" stroke-width="1" marker-end="url(#a1)"/>
  <rect x="190" y="66" width="105" height="40" rx="4" fill="#5b7ea1"/><text x="242" y="83" font-size="10" fill="#fff" text-anchor="middle" font-weight="500">Chunker</text><text x="242" y="97" font-size="8" fill="#c5d5e4" text-anchor="middle">MD-aware 递归</text>
  <line x1="295" y1="86" x2="330" y2="86" stroke="#5b7ea1" stroke-width="1" marker-end="url(#a1)"/>
  <rect x="330" y="66" width="120" height="40" rx="4" fill="#5b7ea1"/><text x="390" y="83" font-size="10" fill="#fff" text-anchor="middle" font-weight="500">Embedder</text><text x="390" y="97" font-size="8" fill="#c5d5e4" text-anchor="middle">BAAI/bge-m3</text>
  <line x1="450" y1="86" x2="495" y2="86" stroke="#5b7ea1" stroke-width="1" marker-end="url(#a1)"/>
  <rect x="495" y="66" width="125" height="40" rx="4" fill="#6b5b7b"/><text x="557" y="83" font-size="10" fill="#fff" text-anchor="middle" font-weight="500">VectorStore</text><text x="557" y="97" font-size="8" fill="#d4cce0" text-anchor="middle">ChromaDB 持久化</text>
  <line x1="620" y1="86" x2="660" y2="86" stroke="#6b5b7b" stroke-width="1" marker-end="url(#a2)"/>
  <rect x="660" y="66" width="140" height="40" rx="4" fill="#6b5b7b"/><text x="730" y="83" font-size="10" fill="#fff" text-anchor="middle" font-weight="500">BM25 Index</text><text x="730" y="97" font-size="8" fill="#d4cce0" text-anchor="middle">rank_bm25 稀疏索引</text>

  <!-- Query -->
  <text x="40" y="140" font-size="10" fill="#a15b6b" font-weight="600" letter-spacing="0.5">QUERY PATH — HybridRetriever</text>
  <rect x="40" y="150" width="115" height="40" rx="4" fill="#a15b6b"/><text x="97" y="167" font-size="10" fill="#fff" text-anchor="middle" font-weight="500">User Query</text><text x="97" y="181" font-size="8" fill="#dfc5cb" text-anchor="middle">自然语言问题</text>
  <line x1="155" y1="170" x2="195" y2="170" stroke="#a15b6b" stroke-width="1" marker-end="url(#a3)"/>
  <circle cx="210" cy="170" r="14" fill="none" stroke="#a15b6b" stroke-width="1"/><text x="210" y="174" font-size="11" fill="#a15b6b" text-anchor="middle" font-weight="600">⑂</text>
  <!-- Vector branch -->
  <line x1="224" y1="160" x2="285" y2="148" stroke="#6b5b7b" stroke-width="0.8" marker-end="url(#a2)"/>
  <rect x="285" y="132" width="155" height="32" rx="4" fill="#6b5b7b"/><text x="362" y="152" font-size="10" fill="#fff" text-anchor="middle">Vector Cosine Search</text>
  <!-- BM25 branch -->
  <line x1="224" y1="180" x2="285" y2="194" stroke="#8c7a6b" stroke-width="0.8" marker-end="url(#a4)"/>
  <rect x="285" y="180" width="155" height="32" rx="4" fill="#8c7a6b"/><text x="362" y="200" font-size="10" fill="#fff" text-anchor="middle">BM25 Sparse Search</text>
  <!-- Merge -->
  <line x1="440" y1="148" x2="495" y2="166" stroke="#6b5b7b" stroke-width="0.8"/>
  <line x1="440" y1="196" x2="495" y2="178" stroke="#8c7a6b" stroke-width="0.8"/>
  <rect x="495" y="154" width="160" height="40" rx="4" fill="#4a7c6f"/><text x="575" y="171" font-size="10" fill="#fff" text-anchor="middle" font-weight="600">Score Fusion</text><text x="575" y="185" font-size="8" fill="#c8ddd6" text-anchor="middle">α·BM25 + (1-α)·Vector</text>
  <line x1="655" y1="174" x2="695" y2="174" stroke="#4a7c6f" stroke-width="1" marker-end="url(#a5)"/>
  <rect x="695" y="154" width="130" height="40" rx="4" fill="#3d4f5f"/><text x="760" y="171" font-size="10" fill="#fff" text-anchor="middle" font-weight="600">LLM Context</text><text x="760" y="185" font-size="8" fill="#a0b0be" text-anchor="middle">注入 top-k 参考</text>

  <!-- Formula -->
  <rect x="50" y="252" width="820" height="36" rx="3" fill="#f7f8fa" stroke="#d5d8dc"/>
  <text x="460" y="275" font-size="12" text-anchor="middle" font-family="Georgia, Times New Roman, serif" fill="#2c3e50" font-style="italic">
    score = α · BM25_norm + (1 − α) · cos_sim,   α = 0.3
  </text>
</svg>
