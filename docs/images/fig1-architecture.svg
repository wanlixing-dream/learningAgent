<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 540" width="920" height="540" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif">
  <defs>
    <marker id="arrowBlue" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#4361ee"/></marker>
    <marker id="arrowOrange" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#fb8500"/></marker>
    <marker id="arrowPurple" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#7209b7"/></marker>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fafbff"/><stop offset="100%" stop-color="#f5f5fa"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="920" height="540" rx="12" fill="url(#bgGrad)" stroke="#e0e0e8" stroke-width="1"/>
  <!-- Title -->
  <text x="460" y="32" font-size="15" fill="#1a1a2e" text-anchor="middle" font-weight="700">Fig 1. Three-Layer Agent Architecture</text>

  <!-- Interface Layer -->
  <rect x="40" y="50" width="840" height="80" rx="10" fill="#eef2ff" stroke="#4361ee" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="60" y="76" font-size="11" fill="#4361ee" font-weight="600">Interface Layer</text>
  <rect x="100" y="82" width="110" height="34" rx="6" fill="#4361ee"/><text x="155" y="103" font-size="12" fill="#fff" text-anchor="middle" font-weight="500">CLI REPL</text>
  <rect x="225" y="82" width="130" height="34" rx="6" fill="#4361ee"/><text x="290" y="103" font-size="12" fill="#fff" text-anchor="middle" font-weight="500">Web Dashboard</text>
  <rect x="370" y="82" width="120" height="34" rx="6" fill="#4361ee"/><text x="430" y="103" font-size="12" fill="#fff" text-anchor="middle" font-weight="500">MCP Server</text>
  <rect x="505" y="82" width="120" height="34" rx="6" fill="#4361ee"/><text x="565" y="103" font-size="12" fill="#fff" text-anchor="middle" font-weight="500">REST API</text>
  <!-- Arrow -->
  <line x1="360" y1="130" x2="360" y2="155" stroke="#4361ee" stroke-width="1.5" marker-end="url(#arrowBlue)"/>

  <!-- Coordination Layer -->
  <rect x="40" y="155" width="840" height="90" rx="10" fill="#fff3e0" stroke="#fb8500" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="60" y="182" font-size="11" fill="#fb8500" font-weight="600">Coordination Layer — MainAgent</text>
  <rect x="100" y="192" width="150" height="36" rx="6" fill="#fb8500"/><text x="175" y="214" font-size="11" fill="#fff" text-anchor="middle" font-weight="500">Intent Recognizer</text>
  <rect x="265" y="192" width="135" height="36" rx="6" fill="#fb8500"/><text x="332" y="214" font-size="11" fill="#fff" text-anchor="middle" font-weight="500">Command Router</text>
  <rect x="415" y="192" width="150" height="36" rx="6" fill="#fb8500"/><text x="490" y="214" font-size="11" fill="#fff" text-anchor="middle" font-weight="500">Session Manager</text>
  <rect x="580" y="192" width="150" height="36" rx="6" fill="#fb8500"/><text x="655" y="214" font-size="11" fill="#fff" text-anchor="middle" font-weight="500">TraceRecorder</text>
  <!-- Arrows down -->
  <line x1="175" y1="245" x2="150" y2="280" stroke="#fb8500" stroke-width="1.2" marker-end="url(#arrowOrange)"/>
  <line x1="332" y1="245" x2="340" y2="280" stroke="#fb8500" stroke-width="1.2" marker-end="url(#arrowOrange)"/>
  <line x1="490" y1="245" x2="530" y2="280" stroke="#fb8500" stroke-width="1.2" marker-end="url(#arrowOrange)"/>
  <line x1="655" y1="245" x2="720" y2="280" stroke="#fb8500" stroke-width="1.2" marker-end="url(#arrowOrange)"/>

  <!-- Functional Layer -->
  <rect x="40" y="280" width="840" height="95" rx="10" fill="#f3e5f5" stroke="#7209b7" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="60" y="306" font-size="11" fill="#7209b7" font-weight="600">Functional Layer — Domain Agents</text>
  <rect x="70" y="314" width="160" height="44" rx="6" fill="#7209b7"/>
  <text x="150" y="333" font-size="10.5" fill="#fff" text-anchor="middle" font-weight="500">CreatePlanAgent</text>
  <text x="150" y="348" font-size="9" fill="#e0cfef" text-anchor="middle">学习计划生成</text>
  <rect x="245" y="314" width="180" height="44" rx="6" fill="#7209b7"/>
  <text x="335" y="333" font-size="10.5" fill="#fff" text-anchor="middle" font-weight="500">AddKnowledgeProcessor</text>
  <text x="335" y="348" font-size="9" fill="#e0cfef" text-anchor="middle">知识入库 + RAG 索引</text>
  <rect x="440" y="314" width="175" height="44" rx="6" fill="#7209b7"/>
  <text x="527" y="333" font-size="10.5" fill="#fff" text-anchor="middle" font-weight="500">VibeLearningAgent</text>
  <text x="527" y="348" font-size="9" fill="#e0cfef" text-anchor="middle">互动学习 + 掌握度追踪</text>
  <rect x="630" y="314" width="160" height="44" rx="6" fill="#7209b7"/>
  <text x="710" y="333" font-size="10.5" fill="#fff" text-anchor="middle" font-weight="500">SummaryAgent</text>
  <text x="710" y="348" font-size="9" fill="#e0cfef" text-anchor="middle">进度报告 + 薄弱点分析</text>
  <!-- Arrow -->
  <line x1="400" y1="375" x2="400" y2="405" stroke="#7209b7" stroke-width="1.5" marker-end="url(#arrowPurple)"/>

  <!-- Infrastructure Layer -->
  <rect x="40" y="405" width="840" height="120" rx="10" fill="#e8f5e9" stroke="#06d6a0" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="60" y="432" font-size="11" fill="#06855a" font-weight="600">Infrastructure Layer</text>
  <rect x="60" y="442" width="140" height="64" rx="6" fill="#06d6a0"/>
  <text x="130" y="464" font-size="10.5" fill="#fff" text-anchor="middle" font-weight="600">RAG Pipeline</text>
  <text x="130" y="478" font-size="8.5" fill="#d0f5e7" text-anchor="middle">Embedder → Chunker</text>
  <text x="130" y="490" font-size="8.5" fill="#d0f5e7" text-anchor="middle">→ ChromaDB → BM25</text>
  <rect x="215" y="442" width="140" height="64" rx="6" fill="#06d6a0"/>
  <text x="285" y="464" font-size="10.5" fill="#fff" text-anchor="middle" font-weight="600">Memory System</text>
  <text x="285" y="478" font-size="8.5" fill="#d0f5e7" text-anchor="middle">7 types · JSONL</text>
  <text x="285" y="490" font-size="8.5" fill="#d0f5e7" text-anchor="middle">5-signal retrieval</text>
  <rect x="370" y="442" width="140" height="64" rx="6" fill="#06d6a0"/>
  <text x="440" y="464" font-size="10.5" fill="#fff" text-anchor="middle" font-weight="600">Mastery Tracker</text>
  <text x="440" y="478" font-size="8.5" fill="#d0f5e7" text-anchor="middle">概念级掌握度</text>
  <text x="440" y="490" font-size="8.5" fill="#d0f5e7" text-anchor="middle">间隔复习调度</text>
  <rect x="525" y="442" width="140" height="64" rx="6" fill="#06d6a0"/>
  <text x="595" y="464" font-size="10.5" fill="#fff" text-anchor="middle" font-weight="600">Observability</text>
  <text x="595" y="478" font-size="8.5" fill="#d0f5e7" text-anchor="middle">TraceRecorder</text>
  <text x="595" y="490" font-size="8.5" fill="#d0f5e7" text-anchor="middle">5-dim Evaluator</text>
  <rect x="680" y="442" width="140" height="64" rx="6" fill="#06d6a0"/>
  <text x="750" y="464" font-size="10.5" fill="#fff" text-anchor="middle" font-weight="600">Storage</text>
  <text x="750" y="478" font-size="8.5" fill="#d0f5e7" text-anchor="middle">Markdown · JSON</text>
  <text x="750" y="490" font-size="8.5" fill="#d0f5e7" text-anchor="middle">JSONL · ChromaDB</text>
</svg>
