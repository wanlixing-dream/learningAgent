<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 250" width="920" height="250" font-family="Helvetica Neue, Arial, PingFang SC, Microsoft YaHei, sans-serif">
  <defs>
    <marker id="l1" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto"><path d="M0,0 L7,2.5 L0,5" fill="#5b7ea1"/></marker>
    <marker id="l2" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto"><path d="M0,0 L7,2.5 L0,5" fill="#6b5b7b"/></marker>
    <marker id="l3" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto"><path d="M0,0 L7,2.5 L0,5" fill="#a15b6b"/></marker>
    <marker id="l5" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto"><path d="M0,0 L7,2.5 L0,5" fill="#4a7c6f"/></marker>
  </defs>
  <rect width="920" height="250" fill="#ffffff"/>
  <text x="460" y="26" font-size="14" fill="#2c3e50" text-anchor="middle" font-weight="700" letter-spacing="0.5">Fig 4.  Adaptive Learning Loop — Mastery Tracking &amp; Spaced Repetition</text>
  <line x1="130" y1="34" x2="790" y2="34" stroke="#bdc3c7" stroke-width="0.5"/>

  <!-- Loop nodes -->
  <rect x="50" y="60" width="155" height="52" rx="4" fill="#5b7ea1"/>
  <text x="127" y="82" font-size="11" fill="#fff" text-anchor="middle" font-weight="600">VibeLearning</text>
  <text x="127" y="100" font-size="8.5" fill="#c5d5e4" text-anchor="middle">Free / Quiz 模式</text>
  <line x1="205" y1="86" x2="260" y2="86" stroke="#5b7ea1" stroke-width="1" marker-end="url(#l1)"/>

  <rect x="260" y="60" width="155" height="52" rx="4" fill="#a15b6b"/>
  <text x="337" y="82" font-size="11" fill="#fff" text-anchor="middle" font-weight="600">Answer Eval</text>
  <text x="337" y="100" font-size="8.5" fill="#dfc5cb" text-anchor="middle">LLM 判定对/错</text>
  <line x1="415" y1="86" x2="470" y2="86" stroke="#a15b6b" stroke-width="1" marker-end="url(#l3)"/>

  <rect x="470" y="60" width="175" height="52" rx="4" fill="#4a7c6f"/>
  <text x="557" y="82" font-size="11" fill="#fff" text-anchor="middle" font-weight="600">MasteryTracker</text>
  <text x="557" y="100" font-size="8.5" fill="#c8ddd6" text-anchor="middle">±mastery · interval</text>
  <line x1="645" y1="86" x2="700" y2="86" stroke="#4a7c6f" stroke-width="1" marker-end="url(#l5)"/>

  <rect x="700" y="60" width="170" height="52" rx="4" fill="#8c7a6b"/>
  <text x="785" y="82" font-size="11" fill="#fff" text-anchor="middle" font-weight="600">Weak Concepts</text>
  <text x="785" y="100" font-size="8.5" fill="#d5cdc3" text-anchor="middle">mastery &lt; 0.4 → 薄弱</text>

  <!-- Feedback loop -->
  <path d="M785,112 L785,160 L127,160 L127,112" fill="none" stroke="#6b5b7b" stroke-width="1" stroke-dasharray="5,3" marker-end="url(#l2)"/>
  <rect x="330" y="150" width="270" height="20" rx="10" fill="#f4f0f7"/>
  <text x="465" y="164" font-size="9.5" fill="#6b5b7b" text-anchor="middle" font-weight="500">反馈循环：薄弱概念优先出题 + 间隔复习调度</text>

  <!-- Rules -->
  <rect x="50" y="200" width="820" height="30" rx="3" fill="#f7f8fa" stroke="#d5d8dc"/>
  <text x="460" y="220" font-size="11" text-anchor="middle" font-family="Georgia, Times New Roman, serif" fill="#2c3e50" font-style="italic">
    correct → mastery += 0.08, review = +3d   |   wrong → mastery −= 0.10, review = +1d
  </text>
</svg>
